name: Performance validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Component tests
        id: components
        continue-on-error: true
        run: npm run test:components

      - name: Synthetic performance scenarios
        id: performance
        continue-on-error: true
        run: npm run test:performance

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Enforce quality gates
        if: always()
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          COMPONENTS_OUTCOME: ${{ steps.components.outcome }}
          PERFORMANCE_OUTCOME: ${{ steps.performance.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          printf 'tests=%s\ncomponents=%s\nperformance=%s\nlint=%s\nbuild=%s\n' \
            "$TESTS_OUTCOME" "$COMPONENTS_OUTCOME" "$PERFORMANCE_OUTCOME" "$LINT_OUTCOME" "$BUILD_OUTCOME"
          test "$TESTS_OUTCOME" = success
          test "$COMPONENTS_OUTCOME" = success
          test "$PERFORMANCE_OUTCOME" = success
          test "$LINT_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
