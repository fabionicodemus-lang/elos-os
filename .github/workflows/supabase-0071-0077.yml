name: Supabase 0071-0077

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  apply:
    if: "${{ github.event.pull_request.title == '[RUN] Supabase 0071-0077' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar PostgreSQL
        run: sudo timeout 60s apt-get update && sudo timeout 60s apt-get install -y postgresql-client
      - name: Aplicar e validar migrations 0071 a 0077
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "10"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/apply-supabase-0071-0077.sh
