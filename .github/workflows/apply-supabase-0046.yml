name: Aplicar migration Supabase 0046

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: apply-supabase-0046
  cancel-in-progress: true

jobs:
  migrate:
    if: github.event.issue.title == '[RUN] Supabase 0046'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "10"
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Informar início
        run: gh issue comment "$ISSUE_NUMBER" --body "Iniciando a migration \`0046\` da memória de associações fornecedor × produto × insumo."

      - name: Normalizar conexão
        id: connection
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import quote, unquote, urlparse
          raw=os.environ.get('SUPABASE_DB_URL','').strip(); normalized=raw
          placeholder=any(x in raw.lower() for x in ('[your-password]','your-password','[password]'))
          try:
            scheme,remainder=raw.split('://',1); credentials,server=remainder.rsplit('@',1); username,password=credentials.split(':',1)
            normalized=f"{scheme}://{quote(unquote(username),safe='')}:{quote(unquote(password),safe='')}@{server}"
          except Exception: pass
          try: host=(urlparse(normalized).hostname or '').lower()
          except Exception: host=''
          kind='pooler' if '.pooler.supabase.com' in host else ('direct' if host.startswith('db.') and host.endswith('.supabase.co') else ('other' if host else 'invalid'))
          if normalized: print(f'::add-mask::{normalized}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f: f.write('EFFECTIVE_DB_URL<<ELOS\n'+normalized+'\nELOS\n')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f: f.write(f'kind={kind}\nplaceholder={str(placeholder).lower()}\nconfigured={str(bool(raw)).lower()}\n')
          PY

      - name: Instalar PostgreSQL
        run: sudo timeout 60s apt-get update && sudo timeout 60s apt-get install -y postgresql-client

      - name: Executar e validar
        id: apply
        shell: bash
        run: |
          set +e
          if [ "${{ steps.connection.outputs.configured }}" != "true" ]; then echo "Secret não configurado." >/tmp/migration.log; status=89
          elif [ "${{ steps.connection.outputs.placeholder }}" = "true" ]; then echo "URI contém senha-placeholder." >/tmp/migration.log; status=90
          elif [ "${{ steps.connection.outputs.kind }}" != "pooler" ]; then echo "Use a URI Session Pooler." >/tmp/migration.log; status=91
          else
            timeout 120s psql "$EFFECTIVE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260729_0046_finance_supplier_product_mappings.sql >/tmp/migration.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            timeout 40s psql "$EFFECTIVE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --command="do \$\$ begin
              if to_regclass('public.finance_supplier_product_mappings') is null then raise exception 'Tabela de associações não criada'; end if;
              if to_regprocedure('public.remember_finance_supplier_product_mapping(uuid,uuid,text,text,text,text,text,uuid)') is null then raise exception 'Função de memória não criada'; end if;
              if not exists(select 1 from pg_indexes where schemaname='public' and tablename='finance_supplier_product_mappings' and indexname='finance_supplier_product_mappings_supplier_idx') then raise exception 'Índice do fornecedor não criado'; end if;
            end \$\$;" >>/tmp/migration.log 2>&1
            status=$?
          fi
          set -e
          cat /tmp/migration.log
          python - <<'PY'
          import os,re
          from pathlib import Path
          text=Path('/tmp/migration.log').read_text(errors='replace')
          for name in ('SUPABASE_DB_URL','EFFECTIVE_DB_URL'):
            if os.environ.get(name): text=text.replace(os.environ[name],'[REDACTED]')
          text=re.sub(r'postgres(?:ql)?://[^\s]+','postgresql://[REDACTED]',text)
          Path('/tmp/safe.log').write_text(text)
          PY
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Confirmar sucesso
        if: steps.apply.outputs.status == '0'
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "✅ Migration 0046 aplicada e validada. A memória de associações por fornecedor e produto foi confirmada. Execução: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Registrar falha
        if: steps.apply.outputs.status != '' && steps.apply.outputs.status != '0'
        run: |
          { echo '❌ A migration 0046 falhou.'; echo; echo '```text'; tail -n 100 /tmp/safe.log; echo '```'; } >/tmp/body.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/body.md
          exit 1
