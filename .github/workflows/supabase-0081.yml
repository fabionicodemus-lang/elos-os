name: Supabase 0081

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  apply:
    if: "${{ github.event.pull_request.title == '[RUN] Supabase 0081' }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Aplicar e validar migration 0081
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "10"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/apply-supabase-0081.sh
