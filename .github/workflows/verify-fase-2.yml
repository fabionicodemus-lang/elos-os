name: Verificar Fase 2 das curvas

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/engenharia/curvas/**"
      - "app/curves.css"
      - "docs/previsao-financeira/**"
      - "package.json"
      - ".github/workflows/verify-fase-2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testes
        run: npm test
      - name: Lint do escopo
        run: npx eslint app/engenharia/curvas/page.tsx app/engenharia/curvas/curve-calculations.mjs app/engenharia/curvas/curve-calculations.d.mts app/engenharia/curvas/curve-calculations.test.mjs
      - name: Build completo
        run: npm run build
