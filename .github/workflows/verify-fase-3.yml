name: Verificar Fase 3 dos contratos

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/engenharia/contratos/**"
      - "app/engineering-contracts.css"
      - "components/app-shell.tsx"
      - "docs/previsao-financeira/03-fase-3.md"
      - "supabase/migrations/20260803_007*.sql"
      - "supabase/tests/20260803_0071_contract_rls.sql"
      - "package.json"
      - ".github/workflows/verify-fase-3.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testes
        run: npm test
      - name: Teste real de RLS multiempresa
        run: psql -h localhost -U postgres -d phase3_test -f supabase/tests/20260803_0071_contract_rls.sql
      - name: Lint dos arquivos alterados
        run: npx eslint app/engenharia/contratos/actions.ts app/engenharia/contratos/page.tsx components/app-shell.tsx
      - name: Build completo
        run: npm run build
