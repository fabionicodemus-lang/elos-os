name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: error
      - name: Instalar PostgreSQL para migration 0049
        if: "${{ github.event_name == 'pull_request' && github.event.pull_request.title == '[RUN] Supabase 0049' }}"
        run: sudo timeout 60s apt-get update && sudo timeout 60s apt-get install -y postgresql-client
      - name: Aplicar e validar migration 0049
        if: "${{ github.event_name == 'pull_request' && github.event.pull_request.title == '[RUN] Supabase 0049' }}"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "10"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/apply-supabase-0049.sh
