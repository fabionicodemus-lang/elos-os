name: Cleanup manual Koper imports

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  cleanup:
    if: "${{ github.event.pull_request.title == '[RUN] Cleanup manual Koper imports' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar PostgreSQL
        run: sudo timeout 60s apt-get update && sudo timeout 60s apt-get install -y postgresql-client
      - name: Corrigir seleção de UUIDs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/cleanup-manual-koper-imports.sh')
          text = path.read_text(encoding='utf-8')
          old_budget = """  select count(*), min(id) into v_budget_count, v_budget_id
            from public.engineering_budgets
            where source_system = 'elos_os'
              and source_id = 'flow_orcamento_r03'
              and code = 'FLOW-ORC'
              and version = 'R03';"""
          new_budget = """  select count(*) into v_budget_count
            from public.engineering_budgets
            where source_system = 'elos_os'
              and source_id = 'flow_orcamento_r03'
              and code = 'FLOW-ORC'
              and version = 'R03';

            select id into v_budget_id
            from public.engineering_budgets
            where source_system = 'elos_os'
              and source_id = 'flow_orcamento_r03'
              and code = 'FLOW-ORC'
              and version = 'R03'
            limit 1;"""
          old_baseline = """  select count(*), min(id) into v_baselines, v_baseline_id
            from public.engineering_schedule_baselines
            where budget_id = v_budget_id;"""
          new_baseline = """  select count(*) into v_baselines
            from public.engineering_schedule_baselines
            where budget_id = v_budget_id;

            select id into v_baseline_id
            from public.engineering_schedule_baselines
            where budget_id = v_budget_id
            limit 1;"""
          if text.count(old_budget) != 1 or text.count(old_baseline) != 1:
              raise SystemExit('Trechos de UUID não encontrados de forma única')
          path.write_text(text.replace(old_budget, new_budget, 1).replace(old_baseline, new_baseline, 1), encoding='utf-8')
          PY
      - name: Incluir solicitação manual vazia
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/cleanup-manual-koper-imports.sh')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "  deleted_payables integer not null,\n  deleted_baselines integer not null,",
                  "  deleted_payables integer not null,\n  deleted_requests integer not null,\n  deleted_baselines integer not null,",
              ),
              (
                  """  select count(*) into v_request_refs from public.execution_material_requests where budget_id = v_budget_id;
            if v_request_refs <> 0 then
              raise exception 'Proteção acionada: existem % solicitações ligadas ao orçamento manual', v_request_refs;
            end if;""",
                  """  select count(*) into v_request_refs from public.execution_material_requests where budget_id = v_budget_id;
            if v_request_refs <> 1 then
              raise exception 'Proteção acionada: esperada 1 solicitação manual, encontradas %', v_request_refs;
            end if;

            if exists (
              select 1 from public.execution_material_requests
              where budget_id = v_budget_id
                and (
                  request_number <> 'SM-0001'
                  or request_number like 'KOPER-%'
                  or coalesce(notes, '') like '%Koper requestId=%'
                )
            ) then
              raise exception 'Proteção acionada: a solicitação vinculada não tem o perfil manual esperado';
            end if;

            if exists (
              select 1
              from public.execution_material_request_items item
              join public.execution_material_requests request on request.id = item.request_id
              where request.budget_id = v_budget_id
            ) then
              raise exception 'Proteção acionada: a solicitação manual possui itens';
            end if;""",
              ),
              (
                  "  v_deleted_payables integer;\n  v_deleted_baselines integer;",
                  "  v_deleted_payables integer;\n  v_deleted_requests integer;\n  v_deleted_baselines integer;",
              ),
              (
                  """  delete from public.payables where source_system = 'koper_flow';
            get diagnostics v_deleted_payables = row_count;

            delete from public.engineering_schedule_baselines where budget_id = v_budget_id;""",
                  """  delete from public.payables where source_system = 'koper_flow';
            get diagnostics v_deleted_payables = row_count;

            delete from public.execution_material_requests where budget_id = v_budget_id;
            get diagnostics v_deleted_requests = row_count;

            delete from public.engineering_schedule_baselines where budget_id = v_budget_id;""",
              ),
              (
                  """    v_deleted_payables,
                v_deleted_baselines,""",
                  """    v_deleted_payables,
                v_deleted_requests,
                v_deleted_baselines,""",
              ),
              (
                  """  if v_result.deleted_payables <> 3261 or v_result.deleted_baselines <> 1 or v_result.deleted_budgets <> 1 then
                raise exception 'Limpeza incompleta: contas %, linhas-base %, orçamentos %',
                  v_result.deleted_payables, v_result.deleted_baselines, v_result.deleted_budgets;""",
                  """  if v_result.deleted_payables <> 3261 or v_result.deleted_requests <> 1 or v_result.deleted_baselines <> 1 or v_result.deleted_budgets <> 1 then
                raise exception 'Limpeza incompleta: contas %, solicitações %, linhas-base %, orçamentos %',
                  v_result.deleted_payables, v_result.deleted_requests, v_result.deleted_baselines, v_result.deleted_budgets;""",
              ),
              (
                  "  'deleted_payables', result.deleted_payables,\n  'deleted_manual_baselines', result.deleted_baselines,",
                  "  'deleted_payables', result.deleted_payables,\n  'deleted_manual_requests', result.deleted_requests,\n  'deleted_manual_baselines', result.deleted_baselines,",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Trecho da solicitação não encontrado de forma única: {old[:80]!r} ({text.count(old)})')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Excluir imports manuais preservando koper-worker
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "10"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/cleanup-manual-koper-imports.sh
