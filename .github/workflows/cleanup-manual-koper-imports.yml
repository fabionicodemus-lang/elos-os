name: Cleanup manual Koper imports

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  cleanup:
    if: "${{ github.event.pull_request.title == '[RUN] Cleanup manual Koper imports' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar PostgreSQL
        run: sudo timeout 60s apt-get update && sudo timeout 60s apt-get install -y postgresql-client
      - name: Corrigir seleção de UUIDs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/cleanup-manual-koper-imports.sh')
          text = path.read_text(encoding='utf-8')
          old_budget = """  select count(*), min(id) into v_budget_count, v_budget_id
            from public.engineering_budgets
            where source_system = 'elos_os'
              and source_id = 'flow_orcamento_r03'
              and code = 'FLOW-ORC'
              and version = 'R03';"""
          new_budget = """  select count(*) into v_budget_count
            from public.engineering_budgets
            where source_system = 'elos_os'
              and source_id = 'flow_orcamento_r03'
              and code = 'FLOW-ORC'
              and version = 'R03';

            select id into v_budget_id
            from public.engineering_budgets
            where source_system = 'elos_os'
              and source_id = 'flow_orcamento_r03'
              and code = 'FLOW-ORC'
              and version = 'R03'
            limit 1;"""
          old_baseline = """  select count(*), min(id) into v_baselines, v_baseline_id
            from public.engineering_schedule_baselines
            where budget_id = v_budget_id;"""
          new_baseline = """  select count(*) into v_baselines
            from public.engineering_schedule_baselines
            where budget_id = v_budget_id;

            select id into v_baseline_id
            from public.engineering_schedule_baselines
            where budget_id = v_budget_id
            limit 1;"""
          if text.count(old_budget) != 1 or text.count(old_baseline) != 1:
              raise SystemExit('Trechos de UUID não encontrados de forma única')
          path.write_text(text.replace(old_budget, new_budget, 1).replace(old_baseline, new_baseline, 1), encoding='utf-8')
          PY
      - name: Excluir imports manuais preservando koper-worker
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "10"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/cleanup-manual-koper-imports.sh
