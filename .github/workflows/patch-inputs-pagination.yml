name: Patch inputs pagination

on:
  push:
    branches: [fix/inputs-pagination-all-rows]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/inputs-pagination-all-rows
      - name: Aplicar paginação completa
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/engenharia/insumos/page.tsx')
          text = path.read_text()

          old_import = 'import { requireCompanyPermission } from "@/lib/workspace";'
          new_import = 'import { fetchAllRows } from "@/lib/supabase-pagination";\nimport { requireCompanyPermission } from "@/lib/workspace";'
          if 'fetchAllRows' not in text:
              text = text.replace(old_import, new_import, 1)

          pattern = re.compile(
              r'    supabase\n      \.from\("engineering_inputs"\).*?      \.limit\(10000\),\n'
              r'    supabase\n      \.from\("engineering_services"\).*?      \.limit\(10000\),',
              re.S,
          )
          replacement = '''    fetchAllRows<EngineeringInput>(async (from, to) => {
              const { data, error } = await supabase
                .from("engineering_inputs")
                .select("id, code, description, unit, category, family_code, family_label, brand_reference, technical_specification, source_system, source_code, notes, status, updated_at")
                .eq("company_id", companyId)
                .order("family_code", { ascending: true, nullsFirst: false })
                .order("code", { ascending: true })
                .range(from, to);
              return { data: (data ?? []) as EngineeringInput[], error };
            }),
            fetchAllRows<UnitRecord>(async (from, to) => {
              const { data, error } = await supabase
                .from("engineering_services")
                .select("unit")
                .eq("company_id", companyId)
                .range(from, to);
              return { data: (data ?? []) as UnitRecord[], error };
            }),'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Bloco de consultas não encontrado: {count}')

          path.write_text(text)
          Path('.github/workflows/patch-inputs-pagination.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/engenharia/insumos/page.tsx .github/workflows/patch-inputs-pagination.yml
          git commit -m "fix: carregar todos os insumos com paginação Supabase"
          git push
