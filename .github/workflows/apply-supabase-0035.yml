name: Aplicar migration Supabase 0035

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

concurrency:
  group: apply-supabase-0035
  cancel-in-progress: true

jobs:
  migrate:
    name: Aplicar centros por serviço no Supabase
    if: github.event.issue.title == '[RUN] Supabase 0035'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "10"
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Informar início
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Iniciando a aplicação controlada da migration \`20260728_0035_material_request_service_centers.sql\`."

      - name: Normalizar conexão
        id: connection
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import quote, unquote, urlparse
          raw = os.environ.get('SUPABASE_DB_URL', '').strip()
          placeholder = any(marker in raw.lower() for marker in ('[your-password]', '<your-password>', 'your-password', '[password]'))
          normalized = raw
          repaired = False
          if raw:
              try:
                  scheme, remainder = raw.split('://', 1)
                  credentials, server = remainder.rsplit('@', 1)
                  username, password = credentials.split(':', 1)
                  normalized = f"{scheme}://{quote(unquote(username), safe='')}:{quote(unquote(password), safe='')}@{server}"
                  repaired = normalized != raw
              except Exception:
                  pass
          try:
              host = (urlparse(normalized).hostname or '').lower()
          except Exception:
              host = ''
          kind = 'pooler' if '.pooler.supabase.com' in host else ('direct' if host.startswith('db.') and host.endswith('.supabase.co') else ('other' if host else 'invalid'))
          if normalized:
              print(f'::add-mask::{normalized}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('EFFECTIVE_DB_URL<<__ELOS_DB_URL__\n' + normalized + '\n__ELOS_DB_URL__\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'configured={str(bool(raw)).lower()}\nplaceholder={str(placeholder).lower()}\nkind={kind}\nrepaired={str(repaired).lower()}\n')
          PY

      - name: Informar conexão
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Conexão detectada: \`${{ steps.connection.outputs.kind }}\`. URI normalizada: \`${{ steps.connection.outputs.repaired }}\`."

      - name: Instalar PostgreSQL
        shell: bash
        run: |
          sudo timeout 60s apt-get update
          sudo timeout 60s apt-get install -y postgresql-client

      - name: Executar e validar migration 0035
        id: apply
        shell: bash
        run: |
          set +e
          if [ "${{ steps.connection.outputs.configured }}" != "true" ]; then
            echo "O secret SUPABASE_DB_URL não está configurado." > /tmp/migration.log
            status=89
          elif [ "${{ steps.connection.outputs.placeholder }}" = "true" ]; then
            echo "A URI ainda contém senha-placeholder." > /tmp/migration.log
            status=90
          elif [ "${{ steps.connection.outputs.kind }}" = "direct" ]; then
            echo "Use a URI Session Pooler do Supabase." > /tmp/migration.log
            status=91
          else
            timeout 70s psql "$EFFECTIVE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 \
              --file=supabase/migrations/20260728_0035_material_request_service_centers.sql \
              > /tmp/migration.log 2>&1
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            timeout 30s psql "$EFFECTIVE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 \
              --command="do \$\$ begin if not exists (select 1 from information_schema.columns where table_schema='public' and table_name='execution_material_request_items' and column_name='cost_center_service_id') then raise exception 'Coluna de serviço não criada'; end if; if to_regprocedure('public.save_execution_material_request(uuid,uuid,uuid,uuid,date,text,jsonb)') is null then raise exception 'Função de gravação não encontrada'; end if; end \$\$;" \
              >> /tmp/migration.log 2>&1
            status=$?
          fi
          set -e
          cat /tmp/migration.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Confirmar sucesso
        if: steps.apply.outputs.status == '0'
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "✅ Migration 0035 aplicada e validada com sucesso. Execução: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Registrar falha
        if: steps.apply.outputs.status != '' && steps.apply.outputs.status != '0'
        shell: bash
        run: |
          {
            echo "❌ A migration 0035 falhou."
            echo
            echo "Execução: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            tail -n 60 /tmp/migration.log
            echo '```'
          } > /tmp/issue-body.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/issue-body.md
          exit 1
