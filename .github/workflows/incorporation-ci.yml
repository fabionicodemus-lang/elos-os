name: Incorporation ERP CI

on:
  pull_request:
    paths:
      - "app/comercial/incorporacao/**"
      - "lib/commercial/**"
      - "supabase/migrations/*commercial*"
      - "tests/commercial/**"
      - "components/app-shell.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/incorporation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  incorporation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:incorporation
      - run: npx tsc --noEmit
      - run: npm run build
