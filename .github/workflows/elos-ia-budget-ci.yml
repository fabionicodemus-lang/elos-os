name: Elos IA CI

on:
  pull_request:
    paths:
      - "lib/elos-ia/**"
      - "app/elos-ia/**"
      - "app/api/elos-ia/**"
      - "app/elos-ia.css"
      - "app/elos-ia-actions.css"
      - "app/elos-ia-drawer.css"
      - "components/global-elos-ia-drawer.tsx"
      - "components/project-switcher.tsx"
      - "supabase/migrations/*elos_ia*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/elos-ia-budget-ci.yml"
  workflow_dispatch:

jobs:
  elos-ia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test usage budget
        run: node --test lib/elos-ia/usage-cost.test.mjs
      - name: Test visual answers and commercial calculations
        run: node --test lib/elos-ia/agent-loop.test.mjs lib/elos-ia/summaries.test.mjs lib/elos-ia/visuals.test.mjs lib/elos-ia/commercial-analysis.test.mjs lib/elos-ia/commercial-tools.test.mjs
      - name: Test safe write utilities
        run: node --test lib/elos-ia/action-utils.test.mjs
      - name: Test conversational schedule updates
        run: node --test lib/elos-ia/schedule-action-utils.test.mjs
      - name: Test safe write database
        run: node --test lib/elos-ia/safe-write-db.test.mjs
      - name: Test safe write Financeiro
        run: node --test lib/elos-ia/finance-safe-write-db.test.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint Elos IA
        run: npx eslint app/elos-ia app/api/elos-ia lib/elos-ia components/global-elos-ia-drawer.tsx components/project-switcher.tsx
      - name: Production build
        run: npm run build
