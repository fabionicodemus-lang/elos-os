name: Aplicar migration Supabase 0043
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: apply-supabase-0043
  cancel-in-progress: true
jobs:
  migrate:
    if: github.event.issue.title == '[RUN] Supabase 0043'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "10"
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: gh issue comment "$ISSUE_NUMBER" --body "Iniciando a migration \`20260729_0043_procurement_material_receipts.sql\`."
      - id: connection
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import quote,unquote,urlparse
          raw=os.environ.get('SUPABASE_DB_URL','').strip(); normalized=raw; placeholder=any(x in raw.lower() for x in ('[your-password]','your-password','[password]'))
          try:
            scheme,remainder=raw.split('://',1); credentials,server=remainder.rsplit('@',1); username,password=credentials.split(':',1)
            normalized=f"{scheme}://{quote(unquote(username),safe='')}:{quote(unquote(password),safe='')}@{server}"
          except Exception: pass
          try: host=(urlparse(normalized).hostname or '').lower()
          except Exception: host=''
          kind='pooler' if '.pooler.supabase.com' in host else ('direct' if host.startswith('db.') else ('other' if host else 'invalid'))
          if normalized: print(f'::add-mask::{normalized}')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('EFFECTIVE_DB_URL<<ELOS\n'+normalized+'\nELOS\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'kind={kind}\nplaceholder={str(placeholder).lower()}\nconfigured={str(bool(raw)).lower()}\n')
          PY
      - run: sudo timeout 60s apt-get update && sudo timeout 60s apt-get install -y postgresql-client
      - id: apply
        shell: bash
        run: |
          set +e
          if [ "${{ steps.connection.outputs.configured }}" != "true" ]; then echo "Secret não configurado" >/tmp/migration.log; status=89
          elif [ "${{ steps.connection.outputs.placeholder }}" = "true" ]; then echo "Senha-placeholder" >/tmp/migration.log; status=90
          elif [ "${{ steps.connection.outputs.kind }}" != "pooler" ]; then echo "Use Session Pooler" >/tmp/migration.log; status=91
          else timeout 120s psql "$EFFECTIVE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260729_0043_procurement_material_receipts.sql >/tmp/migration.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then
            timeout 35s psql "$EFFECTIVE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --command="do \$\$ begin
              if to_regclass('public.procurement_material_receipts') is null then raise exception 'Tabela de recebimentos não criada'; end if;
              if to_regclass('public.procurement_material_receipt_items') is null then raise exception 'Tabela de itens não criada'; end if;
              if to_regclass('public.procurement_material_receipt_discrepancies') is null then raise exception 'Tabela de divergências não criada'; end if;
              if to_regprocedure('public.save_procurement_material_receipt(uuid,uuid,uuid,uuid,date,time without time zone,text,text,text,date,numeric,text,text,text,text,text,text,text,jsonb)') is null then raise exception 'Função de gravação não criada'; end if;
              if to_regprocedure('public.approve_procurement_material_receipt(uuid,uuid,uuid,text)') is null then raise exception 'Função de aprovação não criada'; end if;
              if not exists(select 1 from storage.buckets where id='material-receipt-documents') then raise exception 'Bucket não criado'; end if;
            end \$\$;" >>/tmp/migration.log 2>&1; status=$?; fi
          set -e; cat /tmp/migration.log; echo "status=$status" >> "$GITHUB_OUTPUT"
      - if: steps.apply.outputs.status == '0'
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "✅ Migration 0043 aplicada e validada. Recebimentos, itens, divergências, aprovação, permissões e documentos privados foram confirmados. Execução: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue close "$ISSUE_NUMBER" --reason completed
      - if: steps.apply.outputs.status != '' && steps.apply.outputs.status != '0'
        run: |
          { echo '❌ A migration 0043 falhou.'; echo '```text'; tail -n 80 /tmp/migration.log; echo '```'; } >/tmp/body.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/body.md
          exit 1
