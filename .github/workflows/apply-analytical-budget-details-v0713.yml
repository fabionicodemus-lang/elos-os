name: Apply analytical budget details V0.71.3

on:
  push:
    branches:
      - feat/analytical-budget-details-v0713

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'feat: detalhar insumos no orçamento analítico') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        run: python .github/scripts/apply-analytical-budget-details-v0713.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: detalhar insumos no orçamento analítico V0.71.3"
          git push origin HEAD:feat/analytical-budget-details-v0713
