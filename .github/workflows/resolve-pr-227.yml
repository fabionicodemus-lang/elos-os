name: Resolve PR 227 conflicts

on:
  push:
    branches:
      - feature/koper-connector-bootstrap

permissions:
  contents: write

jobs:
  merge-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout da branch da PR
        uses: actions/checkout@v4
        with:
          ref: feature/koper-connector-bootstrap
          fetch-depth: 0

      - name: Mesclar main e resolver conflitos conhecidos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflitos encontrados:\n%s\n' "${conflicts[*]:-nenhum}"

            for path in "${conflicts[@]}"; do
              case "$path" in
                services/koper-worker/*|supabase/migrations/20260801_0067_koper_staging_records.sql|tsconfig.json)
                  git checkout --ours -- "$path"
                  git add -- "$path"
                  ;;
                *)
                  echo "Conflito inesperado, abortando: $path" >&2
                  exit 1
                  ;;
              esac
            done
          fi

          remaining="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$remaining" ]]; then
            echo "Ainda existem conflitos não resolvidos:" >&2
            echo "$remaining" >&2
            exit 1
          fi

          git rm -- .github/workflows/resolve-pr-227.yml
          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para gravar."
            exit 0
          fi

          git commit -m "Merge main into feature/koper-connector-bootstrap"
          git push origin HEAD:feature/koper-connector-bootstrap
