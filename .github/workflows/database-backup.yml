name: Backup do banco

on:
  schedule:
    - cron: "17 6 * * *"     # todo dia, 03:17 em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Gerar backup criptografado
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          PGSSLMODE: require
        run: bash .github/scripts/backup-database.sh
      - name: Guardar backup (30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: elos-os-backup-${{ github.run_id }}
          path: backup/
          retention-days: 30
          if-no-files-found: error

  restore-test:
    needs: backup
    # Testa a restauração aos domingos e em execuções manuais (ver passo "Verificar").
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar se hoje é domingo
        id: day
        run: echo "run=$([ "${{ github.event_name }}" = workflow_dispatch ] || [ "$(date -u +%u)" = 7 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.day.outputs.run == 'yes'
        with:
          name: elos-os-backup-${{ github.run_id }}
          path: backup/
      # O cliente 17 é o mesmo contêiner Docker usado pelo backup.
      - name: Restaurar e conferir
        if: steps.day.outputs.run == 'yes'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: bash .github/scripts/restore-test.sh
