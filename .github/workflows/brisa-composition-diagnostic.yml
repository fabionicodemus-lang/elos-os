name: Brisa composition diagnostic
on:
  push:
    branches: [fix/brisa-composition-diagnostic]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect composition initialization in rollback transaction
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '10'
        run: |
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          select table_name,column_name from information_schema.columns where table_schema='public' and table_name in ('execution_material_requests','execution_material_request_items') order by table_name,ordinal_position;
          SQL
