name: Aplicar migration Supabase 0044
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: apply-supabase-0044
  cancel-in-progress: true
jobs:
  migrate:
    if: github.event.issue.title == '[RUN] Supabase 0044'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "10"
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: gh issue comment "$ISSUE_NUMBER" --body "Iniciando as migrations \`20260729_0044_procurement_inventory.sql\` e \`20260729_0044a_procurement_inventory_backfill_fix.sql\`."
      - id: connection
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import quote,unquote,urlparse
          raw=os.environ.get('SUPABASE_DB_URL','').strip(); normalized=raw; placeholder=any(x in raw.lower() for x in ('[your-password]','your-password','[password]'))
          try:
            scheme,remainder=raw.split('://',1); credentials,server=remainder.rsplit('@',1); username,password=credentials.split(':',1)
            normalized=f"{scheme}://{quote(unquote(username),safe='')}:{quote(unquote(password),safe='')}@{server}"
          except Exception: pass
          try: host=(urlparse(normalized).hostname or '').lower()
          except Exception: host=''
          kind='pooler' if '.pooler.supabase.com' in host else ('direct' if host.startswith('db.') else ('other' if host else 'invalid'))
          if normalized: print(f'::add-mask::{normalized}')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('EFFECTIVE_DB_URL<<ELOS\n'+normalized+'\nELOS\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'kind={kind}\nplaceholder={str(placeholder).lower()}\nconfigured={str(bool(raw)).lower()}\n')
          PY
      - run: sudo timeout 60s apt-get update && sudo timeout 60s apt-get install -y postgresql-client
      - name: Preparar migration base sem carga antecipada
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('supabase/migrations/20260729_0044_procurement_inventory.sql').read_text()
          marker='-- Registra no estoque recebimentos aprovados antes da instalação desta migration.'
          grants='grant select,insert,update,delete on public.procurement_inventory_locations'
          if marker in source and grants in source:
              source=source[:source.index(marker)] + source[source.index(grants):]
          Path('/tmp/0044-base.sql').write_text(source)
          PY
      - id: apply
        shell: bash
        run: |
          set +e
          if [ "${{ steps.connection.outputs.configured }}" != "true" ]; then echo "Secret não configurado" >/tmp/migration.log; status=89
          elif [ "${{ steps.connection.outputs.placeholder }}" = "true" ]; then echo "Senha-placeholder" >/tmp/migration.log; status=90
          elif [ "${{ steps.connection.outputs.kind }}" != "pooler" ]; then echo "Use Session Pooler" >/tmp/migration.log; status=91
          else
            timeout 180s psql "$EFFECTIVE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --file=/tmp/0044-base.sql >/tmp/migration.log 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              timeout 120s psql "$EFFECTIVE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260729_0044a_procurement_inventory_backfill_fix.sql >>/tmp/migration.log 2>&1
              status=$?
            fi
          fi
          if [ "$status" -eq 0 ]; then
            timeout 45s psql "$EFFECTIVE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --command="do \$\$ begin
              if to_regclass('public.procurement_inventory_locations') is null then raise exception 'Tabela de locais não criada'; end if;
              if to_regclass('public.procurement_inventory_balances') is null then raise exception 'Tabela de saldos não criada'; end if;
              if to_regclass('public.procurement_inventory_movements') is null then raise exception 'Tabela de movimentos não criada'; end if;
              if to_regclass('public.procurement_inventory_counts') is null then raise exception 'Tabela de inventários não criada'; end if;
              if to_regprocedure('public.post_procurement_inventory_movement(uuid,uuid,text,date,uuid,uuid,uuid,numeric,numeric,text,date,uuid,text,text,uuid,text,text)') is null then raise exception 'Função de movimentação não criada'; end if;
              if to_regprocedure('public.save_procurement_inventory_count(uuid,uuid,uuid,uuid,date,text,jsonb)') is null then raise exception 'Função de inventário não criada'; end if;
              if not exists(select 1 from public.permissions where key='procurement.inventory.view') then raise exception 'Permissões não criadas'; end if;
              if not exists(select 1 from pg_trigger where tgname='inventory_receipt_approved') then raise exception 'Integração com recebimentos não criada'; end if;
            end \$\$;" >>/tmp/migration.log 2>&1; status=$?; fi
          set -e; cat /tmp/migration.log; echo "status=$status" >> "$GITHUB_OUTPUT"
      - if: steps.apply.outputs.status == '0'
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "✅ Migrations 0044/0044a aplicadas e validadas. Locais, saldos, movimentos, inventários, permissões, entradas automáticas e carga dos recebimentos anteriores foram confirmados. Execução: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue close "$ISSUE_NUMBER" --reason completed
      - if: steps.apply.outputs.status != '' && steps.apply.outputs.status != '0'
        run: |
          { echo '❌ As migrations 0044/0044a falharam.'; echo '```text'; tail -n 100 /tmp/migration.log; echo '```'; } >/tmp/body.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/body.md
          exit 1
