name: Aplicar migration Supabase 0049 por PR

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: apply-supabase-0049-pr
  cancel-in-progress: true

jobs:
  migrate:
    if: github.event.pull_request.merged == true && github.event.pull_request.title == '[RUN] Supabase 0049'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "10"
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Informar início
        run: gh pr comment "$PR_NUMBER" --body "Iniciando a migration \`0049\`: Serviços integrados, limpeza de mão de obra direta e inclusão das empreitadas."

      - name: Normalizar conexão
        id: connection
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import quote, unquote, urlparse
          raw=os.environ.get('SUPABASE_DB_URL','').strip(); normalized=raw
          placeholder=any(x in raw.lower() for x in ('[your-password]','your-password','[password]'))
          try:
            scheme,remainder=raw.split('://',1); credentials,server=remainder.rsplit('@',1); username,password=credentials.split(':',1)
            normalized=f"{scheme}://{quote(unquote(username),safe='')}:{quote(unquote(password),safe='')}@{server}"
          except Exception: pass
          try: host=(urlparse(normalized).hostname or '').lower()
          except Exception: host=''
          kind='pooler' if '.pooler.supabase.com' in host else ('direct' if host.startswith('db.') and host.endswith('.supabase.co') else ('other' if host else 'invalid'))
          if normalized: print(f'::add-mask::{normalized}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f: f.write('EFFECTIVE_DB_URL<<ELOS\n'+normalized+'\nELOS\n')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f: f.write(f'kind={kind}\nplaceholder={str(placeholder).lower()}\nconfigured={str(bool(raw)).lower()}\n')
          PY

      - name: Instalar PostgreSQL
        run: sudo timeout 60s apt-get update && sudo timeout 60s apt-get install -y postgresql-client

      - name: Executar e validar
        id: apply
        shell: bash
        run: |
          set +e
          if [ "${{ steps.connection.outputs.configured }}" != "true" ]; then echo "Secret não configurado." >/tmp/migration.log; status=89
          elif [ "${{ steps.connection.outputs.placeholder }}" = "true" ]; then echo "URI contém senha-placeholder." >/tmp/migration.log; status=90
          elif [ "${{ steps.connection.outputs.kind }}" != "pooler" ]; then echo "Use a URI Session Pooler." >/tmp/migration.log; status=91
          else
            timeout 240s psql "$EFFECTIVE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260729_0049_engineering_services_compositions_merge.sql >/tmp/migration.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            timeout 70s psql "$EFFECTIVE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --command="do \$\$ declare v_count integer; begin
              if to_regprocedure('public.engineering_sync_service_outsourced_labor(uuid)') is null then raise exception 'Função de sincronização não criada'; end if;
              if not exists(select 1 from pg_trigger where tgname='engineering_services_outsourced_labor_sync' and not tgisinternal) then raise exception 'Trigger dos serviços não criado'; end if;
              select count(*) into v_count
              from public.engineering_service_composition_items item
              join public.engineering_inputs input on input.id=item.input_id
              where item.status='active' and input.category='labor'
                and coalesce(input.family_code,'')<>'MO-EMP'
                and public.engineering_normalize_text(input.description) not like '%mao de obra empreitada%';
              if v_count<>0 then raise exception 'Ainda existem % vínculos ativos de mão de obra direta',v_count; end if;
              select count(*) into v_count
              from public.engineering_inputs input
              where input.status='active' and input.category='labor'
                and coalesce(input.family_code,'')<>'MO-EMP'
                and public.engineering_normalize_text(input.description) not like '%mao de obra empreitada%';
              if v_count<>0 then raise exception 'Ainda existem % insumos ativos de mão de obra direta',v_count; end if;
              select count(*) into v_count
              from public.engineering_services service
              where service.status='active'
                and not public.engineering_service_excludes_outsourced_labor(service.description,service.group_code)
                and not exists(
                  select 1
                  from public.engineering_service_compositions composition
                  join public.engineering_service_composition_items item on item.composition_id=composition.id and item.status='active'
                  join public.engineering_inputs input on input.id=item.input_id
                  where composition.service_id=service.id
                    and composition.company_id=service.company_id
                    and input.family_code='MO-EMP'
                );
              if v_count<>0 then raise exception 'Existem % serviços elegíveis sem mão de obra empreitada',v_count; end if;
            end \$\$;" >>/tmp/migration.log 2>&1
            status=$?
          fi
          set -e
          cat /tmp/migration.log
          python - <<'PY'
          import os,re
          from pathlib import Path
          text=Path('/tmp/migration.log').read_text(errors='replace')
          for name in ('SUPABASE_DB_URL','EFFECTIVE_DB_URL'):
            if os.environ.get(name): text=text.replace(os.environ[name],'[REDACTED]')
          text=re.sub(r'postgres(?:ql)?://[^\s]+','postgresql://[REDACTED]',text)
          Path('/tmp/safe.log').write_text(text)
          PY
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Confirmar sucesso
        if: steps.apply.outputs.status == '0'
        run: gh pr comment "$PR_NUMBER" --body "✅ Migration 0049 aplicada e validada. Serviços e composições foram unificados; mão de obra direta foi retirada; empreitadas foram vinculadas somente aos serviços elegíveis. Execução: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Registrar falha
        if: steps.apply.outputs.status != '' && steps.apply.outputs.status != '0'
        run: |
          { echo '❌ A migration 0049 falhou.'; echo; echo '```text'; tail -n 160 /tmp/safe.log; echo '```'; } >/tmp/body.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/body.md
          exit 1
