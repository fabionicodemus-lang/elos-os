name: Banking CI

on:
  pull_request:
    paths:
      - "app/api/banking/**"
      - "app/financeiro/contas-bancarias/**"
      - "lib/banking/**"
      - "supabase/migrations/*banking*"
      - "tests/banking/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  banking:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:banking
      - run: npx tsc --noEmit
