name: eObra importer

on:
  pull_request:
    paths:
      - "lib/eobra-import/**"
      - "app/api/imports/eobra/**"
      - "app/configuracoes/importacoes/**"
      - "tests/imports/**"
      - "lib/finance/**"
      - "tests/finance/partial-*.test.mjs"
      - "supabase/migrations/*eobra*.sql"
      - "supabase/migrations/*partial_settlements.sql"
      - "supabase/migrations/*explicit_correction_policies.sql"
      - ".github/workflows/eobra-import-ci.yml"
  push:
    branches: [main]
    paths:
      - "lib/eobra-import/**"
      - "app/api/imports/eobra/**"
      - "app/configuracoes/importacoes/**"
      - "tests/imports/**"
      - "lib/finance/**"
      - "tests/finance/partial-*.test.mjs"
      - "supabase/migrations/*eobra*.sql"
      - "supabase/migrations/*partial_settlements.sql"
      - "supabase/migrations/*explicit_correction_policies.sql"
      - ".github/workflows/eobra-import-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:eobra
      - run: node --test tests/finance/partial-*.test.mjs
      - run: npx eslint lib/eobra-import app/api/imports/eobra app/configuracoes/importacoes tests/imports
      - run: npx tsc --noEmit
