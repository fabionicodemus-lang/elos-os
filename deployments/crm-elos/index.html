<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Elos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#008780; --brand-strong:#00615c; --brand-soft:#E2F1EF;
  --bg:#EEF1F0; --card:#FFFFFF; --sunken:#F4F7F6;
  --line:#E5EAE8; --line-2:#DCE3E3;
  --ink:#16211F; --muted:#5F7D79; --sidebar:#0F1C1B;
  --danger:#B8453F; --danger-soft:#F7E5E3;
  --warning:#946414; --warning-soft:#FFF3D7;
  --success:#217A50; --success-soft:#E7F3EC;
  --shadow:0 4px 20px rgba(15,28,27,.06);
  --ui:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --display:"Space Grotesk",var(--ui);
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);line-height:1.2}
a{color:var(--brand-strong)}
.mono{font-family:var(--mono)}
.eyebrow{font-size:11px;font-weight:820;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
.side{background:var(--sidebar);padding:20px 10px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px}
.logo{display:flex;gap:10px;align-items:center;padding:0 8px 22px}
.logo .mark{width:39px;height:39px;border-radius:11px;background:linear-gradient(135deg,#008780,#053C39);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:17px;flex:none}
.logo b{display:block;color:#F2F7F6;font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.01em}
.logo small{display:block;color:#7F9995;font-size:11px}
.nav{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:11px;font-size:13px;font-weight:680;color:#B6C6C3}
.nav:hover{background:rgba(255,255,255,.05);color:#E6EFEE}
.nav[aria-current="page"]{background:var(--brand);color:#fff;font-weight:800}
.nav .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px}
.nav[aria-current="page"] .badge{background:var(--brand-strong)}
.side .grow{flex:1}
.status{font-size:12px;color:#7F9995;padding:8px 12px 4px;overflow-wrap:anywhere;border-top:1px solid rgba(255,255,255,.07);margin-top:8px}
.side .link{all:unset;cursor:pointer;padding:6px 12px;font-size:12.5px;color:#7F9995}
.side .link:hover{color:#E6EFEE}
.wrap{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:12;height:72px;display:flex;align-items:center;gap:14px;padding:0 32px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crumb{font-size:13px;color:var(--muted);white-space:nowrap}
.crumb b{color:var(--brand-strong);font-weight:800}
.topbar .grow{flex:1}
.avatar{width:38px;height:38px;border-radius:50%;background:#153E3C;color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex:none}
main{padding:28px 32px 60px;max-width:1280px;width:100%;min-width:0}
.head{margin-bottom:22px}
.head h1{font-size:30px;font-weight:700;letter-spacing:-.04em;margin:6px 0 6px}
.head p{margin:0;color:var(--muted);font-size:13.5px}
.head .red{color:var(--danger);font-weight:700}
.btn{border:1px solid var(--line-2);background:var(--card);padding:0 14px;height:40px;border-radius:11px;cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--brand);color:var(--brand-strong)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-strong);border-color:var(--brand-strong);color:#fff}
.btn.danger{color:var(--danger);border-color:#EFCDC9}
.btn.small{height:34px;border-radius:10px;padding:0 11px;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:26px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi span{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand)}
.kpi.red span::before{background:var(--danger)}
.kpi.orange span::before{background:var(--warning)}
.kpi b{display:block;font-family:var(--display);font-size:25px;font-weight:700;margin-top:7px;letter-spacing:-.02em}
.kpi.red b{color:var(--danger)}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.colmain{flex:1 1 640px;min-width:0}
.sidecol{flex:1 1 320px;max-width:420px;min-width:0}
.group{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
.group h2{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;font-family:var(--ui);padding:12px 16px;background:var(--sunken);border-bottom:1px solid var(--line)}
.group h2 small{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted)}
.group.late h2{background:var(--danger-soft);color:var(--danger)}
.group.late{border-color:#EFCDC9}
.empty{color:var(--muted);padding:16px;font-size:13px}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:13px;align-items:center;width:100%;padding:13px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:hover{background:#F7F9F9}
.item .ic{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px}
.item.late .ic{background:var(--danger-soft);color:var(--danger)}
.item .name{font-size:13.5px;font-weight:600}
.item .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.item .when{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap;color:var(--muted)}
.item .when b{display:block;font-family:var(--ui);font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px}
.late .when{color:var(--danger);font-weight:500}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunken);color:var(--muted)}
.tag.hot{background:var(--warning-soft);color:var(--warning)}
.tag.os{background:var(--brand-soft);color:var(--brand-strong)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(238px,1fr);gap:12px;overflow-x:auto;padding-bottom:14px}
.col{background:var(--sunken);border:1px solid var(--line);border-radius:16px;padding:10px;min-height:200px}
.col h3{font-size:13px;font-weight:700;font-family:var(--ui);padding:4px 6px 10px;display:flex;justify-content:space-between}
.col h3 span{font-family:var(--mono);color:var(--muted);font-weight:500}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:12px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.card:hover{border-color:var(--brand);border-left-color:var(--c)}
.card .name{font-size:13px;font-weight:650}
.card .sub{font-size:12px;color:var(--muted);margin-top:2px}
.card .next{font-size:12px;margin-top:7px;color:var(--muted)}
.card .next.late{color:var(--danger);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.chip{border:1px solid var(--line-2);background:var(--card);border-radius:99px;padding:7px 13px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip:hover{border-color:var(--brand);color:var(--brand-strong)}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-strong);font-weight:700}
.input,select.input,textarea.input{border:1px solid var(--line-2);background:var(--card);border-radius:11px;padding:10px 12px;width:100%;height:42px;font-size:13.5px}
textarea.input{height:auto}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(0,135,128,.12)}
.search{max-width:320px;background:var(--sunken)}
.alert{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
.alert:last-child{border-bottom:0}
.alert .t{font-weight:600}
.alert .d{font-size:12px;color:var(--muted);margin-top:2px}
.alert.red .t{color:var(--danger)}
.alert.orange .t{color:var(--warning)}
.bars{padding:14px 16px}
.bar{margin-bottom:11px}
.bar .lb{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.bar .lb span{font-family:var(--mono);color:var(--muted)}
.bar .tr{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar .fl{height:100%;background:var(--brand);border-radius:99px}
.bar.ok .fl{background:var(--success)}
.bar.lost .fl{background:var(--line-2)}
.scrim{position:fixed;inset:0;background:rgba(5,24,22,.45);z-index:20}
.drawer{position:fixed;top:8px;right:8px;bottom:8px;width:min(660px,100vw - 16px);background:var(--bg);border-radius:17px;z-index:21;overflow-y:auto;padding:22px 24px 60px;box-shadow:0 18px 45px rgba(15,28,27,.16)}
.drawer h2{font-size:21px;font-weight:700;line-height:1.2}
.kv{display:grid;grid-template-columns:140px 1fr;gap:7px 14px;font-size:13.5px;margin:16px 0}
.kv dt{color:var(--muted);font-size:12.5px}
.kv dd{margin:0;overflow-wrap:anywhere}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0;box-shadow:var(--shadow)}
.box h3{font-size:14px;font-weight:700;font-family:var(--ui);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#526163}
label.f .input{margin-top:5px;color:var(--ink);font-weight:400;text-transform:none;letter-spacing:0}
.hist{list-style:none;padding:0;margin:0}
.hist li{border-left:2px solid var(--line-2);padding:0 0 16px 14px;position:relative}
.hist li::before{content:"";position:absolute;left:-5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.hist .meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hist p{margin:3px 0 0;white-space:pre-wrap;font-size:13.5px}
dialog{border:1px solid var(--line);border-radius:17px;background:var(--bg);color:var(--ink);padding:0;width:min(620px,94vw);max-height:92vh;box-shadow:0 18px 45px rgba(15,28,27,.16)}
dialog::backdrop{background:rgba(5,24,22,.45)}
dialog form{padding:24px;display:grid;gap:13px}
dialog h2{font-size:21px;font-weight:700}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--sidebar);color:#E2F1EF;padding:12px 18px;border-radius:12px;z-index:40;font-size:13px;box-shadow:0 18px 45px rgba(15,28,27,.16)}
.doc{max-width:72ch}
.doc h2{font-size:21px;font-weight:700;margin:34px 0 10px}
.doc h3{font-size:16px;font-weight:700;font-family:var(--ui);margin:22px 0 6px}
.doc p,.doc li{font-size:14px}
.doc .lead{font-size:16px;color:var(--muted)}
.tablewrap{overflow-x:auto}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px;margin:12px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.doc th,.doc td{text-align:left;border-bottom:1px solid var(--line);padding:9px 12px;vertical-align:top}
.doc th{font-weight:700;background:var(--sunken)}
.script{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:12px;padding:13px 16px;margin:10px 0;font-size:13.5px}
.progress{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-bottom:26px}
.progress span{display:block;height:100%;background:var(--brand);transition:width .3s}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:start;padding:13px 16px;border-bottom:1px solid var(--line)}
.task:last-of-type{border-bottom:0}
.task:hover{background:#F7F9F9}
.task input{width:20px;height:20px;margin:0;accent-color:var(--brand);cursor:pointer}
.task label{cursor:pointer;display:grid;gap:3px}
.task .tt{font-size:13.5px;font-weight:600}
.task .td{font-size:12.5px;color:var(--muted)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.task-date{font-family:var(--mono);font-size:12px;color:var(--muted)}
.task-date.late{color:var(--danger);font-weight:700}
.addtask{display:grid;grid-template-columns:minmax(220px,1fr) 155px auto;gap:8px;padding:14px 16px;background:var(--sunken);border-top:1px solid var(--line)}
.login{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:var(--sidebar);z-index:50}
.loginbox{background:var(--card);border-radius:17px;padding:30px;width:min(420px,100%);box-shadow:0 18px 45px rgba(5,24,22,.35)}
.loginbox .logo{padding:0 0 20px}
.loginbox .input{margin-bottom:10px}
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{padding:0 16px;height:64px}
  main{padding:20px 16px 110px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--sidebar);z-index:15;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar .nav{height:auto;justify-content:center;padding:13px 2px;border-radius:0;font-size:12px}
  .tabbar .nav[aria-current="page"]{background:transparent;color:#fff;box-shadow:inset 0 3px 0 var(--brand)}
  .tabbar .nav .badge{margin:0 0 0 5px}
  .head h1{font-size:24px}
  .grid2{grid-template-columns:1fr}
  .kv{grid-template-columns:110px 1fr}
  .search{max-width:none}
  .addtask{grid-template-columns:1fr}
  .task{grid-template-columns:auto 1fr}
  .task-actions{grid-column:2;justify-content:flex-start}
  .drawer{right:0;bottom:0;border-radius:17px 17px 0 0;padding:20px 16px 60px;width:100%;top:44px}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .2s cubic-bezier(.2,.8,.2,1)}
  @keyframes slide{from{transform:translateX(24px);opacity:0}}
}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<div class="login" id="login">
  <div class="loginbox">
    <div class="logo"><span class="mark">E</span><span><b>Elos CRM</b><small>Prospecção comercial</small></span></div>
    <p id="loginMsg" style="color:var(--muted);margin:0 0 16px">Entre com seu e-mail e senha.</p>
    <form id="loginForm">
      <input class="input" type="email" name="email" placeholder="seu@email.com" required autocomplete="username">
      <input class="input" type="password" name="senha" placeholder="senha" required autocomplete="current-password">
      <button class="btn primary" type="submit" style="width:100%;margin-top:4px;justify-content:center">Entrar</button>
    </form>
  </div>
</div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="logo"><span class="mark">E</span><span><b>Elos CRM</b><small>Prospecção comercial</small></span></div>
    <button class="nav" data-nav="hoje">Hoje<span class="badge" id="badgeAgenda" hidden></span></button>
    <button class="nav" data-nav="funil">Pipeline</button>
    <button class="nav" data-nav="contatos">Empresas</button>
    <button class="nav" data-nav="tarefas">Tarefas</button>
    <button class="nav" data-nav="estrategia">Estratégia</button>
    <div class="grow"></div>
    <div class="status" id="status">Conectando…</div>
    <button class="link" id="trocarSenha">Trocar senha</button>
    <button class="link" id="sair">Sair</button>
  </aside>
  <div class="wrap">
    <header class="topbar">
      <div class="crumb">Elos CRM <span>›</span> <b id="crumb">Hoje</b></div>
      <div class="grow"></div>
      <button class="btn primary" data-act="nova">+ Nova empresa</button>
      <div class="avatar" id="avatar">E</div>
    </header>
    <main id="main"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" hidden>
  <button class="nav" data-nav="hoje">Hoje<span class="badge" id="badgeAgendaM" hidden></span></button>
  <button class="nav" data-nav="funil">Pipeline</button>
  <button class="nav" data-nav="contatos">Empresas</button>
  <button class="nav" data-nav="tarefas">Tarefas</button>
  <button class="nav" data-nav="estrategia">Plano</button>
</nav>
<div id="drawerRoot"></div>
<dialog id="dlg">
  <form id="empForm">
    <h2 id="dlgTitle">Nova empresa</h2>
    <input type="hidden" name="id">
    <label class="f">Nome da empresa *<input class="input" name="nome" required></label>
    <div class="grid2">
      <label class="f">Tipo
        <select class="input" name="tipo" id="fTipo"></select></label>
      <label class="f">Cidade
        <input class="input" name="cidade" list="cidades"></label>
    </div>
    <label class="f">Endereço<input class="input" name="endereco"></label>
    <div class="grid2">
      <label class="f">Pessoa de contato<input class="input" name="contato"></label>
      <label class="f">Cargo<input class="input" name="cargo" placeholder="Ex.: síndico, diretor técnico"></label>
    </div>
    <div class="grid2">
      <label class="f">WhatsApp / telefone<input class="input" name="telefone" inputmode="tel" placeholder="(47) 99999-9999"></label>
      <label class="f">E-mail<input class="input" name="email" type="email"></label>
    </div>
    <div class="grid2">
      <label class="f">Instagram / site<input class="input" name="site"></label>
      <label class="f">Como chegamos nela<input class="input" name="origem" list="origens"></label>
    </div>
    <div class="grid2">
      <label class="f">Serviço de interesse
        <select class="input" name="servico" id="fServico"></select></label>
      <label class="f">Valor estimado (R$)<input class="input" name="valor" inputmode="decimal" placeholder="0"></label>
    </div>
    <div class="grid2">
      <label class="f">Etapa
        <select class="input" name="etapa" id="fEtapa"></select></label>
      <label class="f">Elos OS
        <select class="input" name="elosOs" id="fOs"></select></label>
    </div>
    <div class="grid2">
      <label class="f">Próxima ação<input class="input" name="proximaAcao" placeholder="Ex.: ligar para marcar visita"></label>
      <label class="f">Data da próxima ação<input class="input" name="proximaData" type="date"></label>
    </div>
    <label class="f" style="display:flex;gap:10px;align-items:center;color:var(--ink);font-size:13px;text-transform:none;letter-spacing:0;font-weight:600"><input type="checkbox" name="quente" value="1" style="width:20px;height:20px;accent-color:var(--brand)"> Contato de relacionamento (conhecemos o dono)</label>
    <label class="f">Observações<textarea class="input" name="notas" rows="3" placeholder="Obras em andamento, quantos condomínios administra, dores que citou…"></textarea></label>
    <div class="row" style="justify-content:space-between">
      <button type="button" class="btn danger" id="delBtn" hidden>Excluir empresa</button>
      <span></span>
      <div class="row">
        <button type="button" class="btn" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn primary">Salvar empresa</button>
      </div>
    </div>
  </form>
</dialog>
<dialog id="taskDlg">
  <form id="taskEditForm">
    <h2>Editar tarefa</h2>
    <input type="hidden" name="id">
    <input type="hidden" name="base">
    <label class="f">Tarefa<input class="input" name="titulo" maxlength="240" required></label>
    <div class="grid2">
      <label class="f">Data<input class="input" type="date" name="data"></label>
      <label class="f">Fase<select class="input" name="fase"></select></label>
    </div>

<script>
const ETAPAS=[["mapeado","Mapeado"],["contato","Primeiro contato"],["reuniao","Reunião / visita"],["proposta","Proposta enviada"],["negociacao","Negociação"],["fechado","Fechado"],["perdido","Perdido"]];

const SERVICOS=[["orcamento","Orçamento de obra"],["consultoria","Consultoria"],["execucao","Execução em condomínio"],["elos_os","Elos OS"],["indefinido","Ainda não sei"]];
const CANAIS=[["visita","Visita presencial"],["whatsapp","WhatsApp"],["ligacao","Ligação"],["email","E-mail"],["reuniao","Reunião"],["proposta","Proposta enviada"],["outro","Outro"]];
const OS=[["nao","Não oferecido"],["oferecido","Oferecido"],["teste","Em teste"],["ativo","Cliente ativo"],["recusou","Recusou"]];
const lbl=(arr,k)=>(arr.find(a=>a[0]===k)||[,k||"—"])[1];
const state={empresas:[],interacoes:[],tarefas:[],view:"hoje",tipo:"todos",cidade:"",busca:"",aberta:null,nome:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hoje=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDias=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fmtData=iso=>{if(!iso)return"";const d=new Date(iso+"T12:00:00");return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})};
const fmtR$=v=>{const n=parseFloat(String(v||"").replace(/\./g,"").replace(",","."));return isNaN(n)||!n?"":n.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0})};
const cor=t=>`var(--t-${TIPOS.some(x=>x[0]===t)?t:"outro"})`;
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const SUPABASE_URL="https://ivvfguxijohxyiykacnd.supabase.co";
const SUPABASE_KEY="sb_publishable_dCyqNgp56RnuCdXIf0Dbog_1kifoWcH";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nn=v=>(v===""||v===undefined||v===null)?null:v;
const ss=v=>(v===null||v===undefined)?"":v;
const EMP={nome:["nome",ss],tipo:["tipo",ss],cidade:["cidade",ss],endereco:["endereco",ss],contato:["contato",ss],cargo:["cargo",ss],telefone:["telefone",ss],email:["email",ss],site:["site",ss],origem:["origem",ss],servico:["servico",ss],valor:["valor",ss],etapa:["etapa",ss],elosOs:["elos_os",ss],quente:["quente",v=>!!v],proximaAcao:["proxima_acao",ss],proximaData:["proxima_data",nn],ultimoContato:["ultimo_contato",nn],notas:["notas",ss]};
function empToDb(o){const d={};for(const k in EMP)if(k in o&&o[k]!==undefined)d[EMP[k][0]]=EMP[k][1](o[k]);return d}
const empFromDb=r=>({id:r.id,nome:r.nome,tipo:r.tipo,cidade:ss(r.cidade),endereco:ss(r.endereco),contato:ss(r.contato),cargo:ss(r.cargo),telefone:ss(r.telefone),email:ss(r.email),site:ss(r.site),origem:ss(r.origem),servico:r.servico,valor:ss(r.valor),etapa:r.etapa,elosOs:r.elos_os,quente:!!r.quente,proximaAcao:ss(r.proxima_acao),proximaData:ss(r.proxima_data),ultimoContato:ss(r.ultimo_contato),notas:ss(r.notas),criadoEm:r.criado_em});
function intToDb(o){const d={};if("empresaId"in o)d.empresa_id=o.empresaId;for(const k of ["canal","data","resumo"])if(k in o)d[k]=o[k];return d}
const intFromDb=r=>({id:r.id,empresaId:r.empresa_id,canal:r.canal,data:r.data,resumo:ss(r.resumo),criadoEm:r.criado_em});
function tarToDb(o){const d={};for(const k of ["id","custom","fase","titulo","feito"])if(k in o)d[k]=o[k];if("feitoEm"in o)d.feito_em=nn(o.feitoEm);if("data"in o)d.data=nn(o.data);if("excluida"in o)d.excluida=!!o.excluida;return d}
const tarFromDb=r=>({id:r.id,custom:!!r.custom,fase:ss(r.fase),titulo:ss(r.titulo),feito:!!r.feito,feitoEm:ss(r.feito_em),data:ss(r.data),excluida:!!r.excluida});
const CONV={empresas:empToDb,interacoes:intToDb,tarefas:tarToDb};
const Store={
  async add(col,body){
    const row=CONV[col](body);
    if(col==="tarefas"&&!row.id)row.id=uid();
    const {data,error}=await sb.from(col).insert(row).select("id").single();
    if(error)throw error;
    await carregar();
    return data.id;
  },
  async set(col,id,body){const {error}=await sb.from(col).update(CONV[col](body)).eq("id",id);if(error)throw error;await carregar()},
  async patch(col,id,body){const {error}=await sb.from(col).update(CONV[col](body)).eq("id",id);if(error)throw error;await carregar()},
  async del(col,id){const {error}=await sb.from(col).delete().eq("id",id);if(error)throw error;await carregar()}
};
async function tentar(fn,okMsg){
  try{await fn();if(okMsg)toast(okMsg)}
  catch(e){toast("Não foi possível salvar. Verifique a conexão e tente de novo.");console.error(e)}
}
async function carregar(){
  const [e,i,t]=await Promise.all([
    sb.from("empresas").select("*").order("nome"),
    sb.from("interacoes").select("*").order("data",{ascending:false}).limit(3000),
    sb.from("tarefas").select("*")
  ]);
  if(e.error||i.error||t.error){console.error(e.error||i.error||t.error);$("#status").textContent="Erro ao carregar";return}
  state.empresas=e.data.map(empFromDb);
  state.interacoes=i.data.map(intFromDb);
  state.tarefas=t.data.map(tarFromDb);
  renderAll();
}
function mostrarLogin(msg){
  $("#login").hidden=false;$("#app").hidden=true;$("#tabbar").hidden=true;
  if(msg)$("#loginMsg").textContent=msg;
}
$("#loginForm").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const email=ev.target.elements.email.value.trim();
  const password=ev.target.elements.senha.value;
  const btn=ev.target.querySelector("button");btn.disabled=true;btn.textContent="Entrando…";
  const {error}=await sb.auth.signInWithPassword({email,password});
  btn.disabled=false;btn.textContent="Entrar";
  if(error){$("#loginMsg").textContent="E-mail ou senha incorretos. Tente de novo.";return}
  ev.target.elements.senha.value="";

});

  if(!nova)return;
  if(nova.length<6){toast("A senha precisa ter pelo menos 6 caracteres.");return}
  const {error}=await sb.auth.updateUser({password:nova});
  toast(error?"Não foi possível trocar a senha.":"Senha alterada.");
});
async function entrar(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){mostrarLogin();return}
  const teste=await sb.from("empresas").select("id").limit(1);
  if(teste.error){
    await sb.auth.signOut();
    mostrarLogin("O e-mail "+session.user.email+" não tem acesso ao CRM da Elos.");
    return;
  }
  $("#login").hidden=true;$("#app").hidden=false;$("#tabbar").hidden=false;
  $("#status").textContent=session.user.email;
  state.nome=({"fabio.nicodemus@gmail.com":"Fábio","beatrizfgoncalez@gmail.com":"Bia"})[session.user.email]||session.user.email.split("@")[0];
  $("#avatar").textContent=state.nome.charAt(0).toUpperCase();
  await carregar();
  if(!state.timer){
    state.timer=setInterval(()=>{if(!document.hidden)carregar()},30000);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)carregar()});
  }
}
const NOMES={hoje:"Hoje",funil:"Pipeline",contatos:"Empresas",tarefas:"Tarefas",estrategia:"Estratégia"};

  return `<section class="group ${cls||""}"><h2>${titulo} <small>${sub}</small></h2>

  return `<section class="group ${cls||""}"><h2>${titulo} <small>${lista.length}</small></h2>
    ${lista.length?lista.map(taskRow).join(""):`<div class="empty">${vazio}</div>`}</section>`;
}
function vHoje(){
  const h=hoje(),sem=addDias(h,7);
  const tarefasAgenda=listaTarefas().filter(t=>!t.feito&&t.data).sort((a,b)=>(a.data||"").localeCompare(b.data||""));
  const tarefasAtras=tarefasAgenda.filter(t=>t.data<h);
  const tarefasHoje=tarefasAgenda.filter(t=>t.data===h);
  const tarefasProx=tarefasAgenda.filter(t=>t.data>h&&t.data<=sem);
  const ativas=state.empresas.filter(e=>e.etapa!=="perdido");
  const ord=(a,b)=>(a.proximaData||"").localeCompare(b.proximaData||"");
  const atras=ativas.filter(e=>e.proximaData&&e.proximaData<h).sort(ord);
  const doDia=ativas.filter(e=>e.proximaData===h);
  const prox=ativas.filter(e=>e.proximaData>h&&e.proximaData<=sem).sort(ord);
  const andamento=ativas.filter(e=>!["mapeado","fechado"].includes(e.etapa||"mapeado"));
  const soltas=andamento.filter(e=>!e.proximaData);
  const quentes=state.empresas.filter(e=>e.quente&&(e.etapa||"mapeado")==="mapeado");
  const semOs=state.empresas.filter(e=>e.etapa==="fechado"&&(!e.elosOs||e.elosOs==="nao"));
  const cont=k=>state.empresas.filter(e=>e.etapa===k).length;
  const val=k=>state.empresas.filter(e=>e.etapa===k).reduce((s,e)=>s+(parseFloat(String(e.valor||"").replace(/\./g,"").replace(",","."))||0),0);
  const hora=new Date().getHours();
  const saud=hora<12?"Bom dia":hora<18?"Boa tarde":"Boa noite";
  const dl=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  const hm=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  const atencao=[...soltas.map(e=>({e,cls:"orange",t:"Sem próxima atividade",d:lbl(ETAPAS,e.etapa)+(e.cidade?" · "+e.cidade:"")})),
    ...quentes.map(e=>({e,cls:"red",t:"Conhecido ainda sem contato",d:e.cidade||"Construtora"})),
    ...semOs.map(e=>({e,cls:"",t:"Cliente sem oferta do Elos OS",d:e.cidade||""}))].slice(0,12);
  const maxEtapa=Math.max(1,...ETAPAS.map(([k])=>cont(k)));
  const kpis=[["Empresas mapeadas",cont("mapeado"),""],["Retornos atrasados",atras.length,"red"],["Retornos hoje",doDia.length,""],
    ["Tarefas atrasadas",tarefasAtras.length,"red"],["Tarefas hoje",tarefasHoje.length,""],
    ["Em negociação",cont("proposta")+cont("negociacao"),""],
    ["Propostas abertas",fmtR$(String(val("proposta")+val("negociacao")))||"R$ 0","orange"]];
  return `<div class="head">
    <div class="eyebrow">${esc(dl.charAt(0).toUpperCase()+dl.slice(1))} · ${hm}</div>
    <h1>${saud}, ${esc(state.nome||"")}</h1>
    <p>${atras.length||tarefasAtras.length?`<span class="red">${atras.length} retorno(s) e ${tarefasAtras.length} tarefa(s) atrasados</span>. `:"Nada atrasado. "}${doDia.length} retorno(s) e ${tarefasHoje.length} tarefa(s) para hoje.</p>
  </div>
  <div class="kpis">${kpis.map(([n,v,c])=>`<div class="kpi ${c}"><span>${n}</span><b>${v}</b></div>`).join("")}</div>
  <div class="cols">
    <div class="colmain">
      ${taskGrupo("Tarefas atrasadas",tarefasAtras,"Nenhuma tarefa atrasada.","late")}
      ${taskGrupo("Tarefas de hoje",tarefasHoje,"Nenhuma tarefa marcada para hoje.")}
      ${taskGrupo("Tarefas · próximos 7 dias",tarefasProx,"Nenhuma tarefa agendada para os próximos 7 dias.")}
      ${grupo("Retornos atrasados",atras.length,atras,"Nenhum retorno atrasado.",null,"late")}
      ${grupo("Hoje",doDia.length,doDia,"Nenhum retorno marcado para hoje.")}
      ${grupo("Próximos 7 dias",prox.length,prox,"Semana livre — bom momento para abrir novos contatos.")}
      ${grupo("Comece por aqui",quentes.length+" conhecidos",quentes,"Todos os conhecidos já foram contatados.",()=>"ligar")}
    </div>
    <div class="sidecol">
      <section class="group"><h2>Precisam de atenção <small>${atencao.length}</small></h2>
        ${atencao.length?atencao.map(a=>`<div class="alert ${a.cls}"><div><div class="t">${esc(a.e.nome)}</div><div class="d">${esc(a.t)}${a.d?" · "+esc(a.d):""}</div></div>
          <button class="btn small" data-open="${a.e.id}">Abrir</button></div>`).join(""):`<div class="empty">Nada pendente. Bom trabalho.</div>`}
      </section>
      <section class="group"><h2>Pipeline <small>${state.empresas.length} empresas</small></h2>
        <div class="bars">${ETAPAS.map(([k,n])=>`<div class="bar ${k==="fechado"?"ok":k==="perdido"?"lost":""}">
          <div class="lb">${n}<span>${cont(k)}</span></div>
          <div class="tr"><div class="fl" style="width:${Math.round(cont(k)/maxEtapa*100)}%"></div></div></div>`).join("")}</div>
      </section>
    </div>
  </div>`;
}

function listaTarefas(){

    id,fase:st[id]?.fase||fase,titulo:st[id]?.titulo||titulo,det,

  const extra=state.tarefas.filter(t=>t.custom&&!t.excluida).map(t=>({...t,det:"",base:false}));

}

function vEstrategia(){return `<div class="head"><div class="eyebrow">Playbook</div><h1>Estratégia</h1><p>O plano comercial da Elos, para consultar antes de sair a campo.</p></div>
<article class="doc">
<p class="lead">A Elos vende três coisas que se encadeiam: o orçamento abre a porta, a execução gera caixa e o Elos OS transforma cliente de projeto em receita recorrente.</p>
<h2>Os dois públicos</h2>
<h3>Construtoras: orçamento e controle de custo</h3>
<p>Quem compra: dono ou diretor técnico de construtora de pequeno e médio porte, com 1 a 5 obras verticais em andamento ou em lançamento. Essas empresas normalmente não têm um orçamentista dedicado e fecham o custo da obra com base em planilhas antigas ou no feeling do engenheiro.</p>
<p>O que dói para elas: estourar o custo previsto, errar o preço de venda das unidades, não saber quanto ainda falta gastar, perder tempo levantando quantitativos.</p>
<p>O que oferecemos: orçamento analítico de obras, consultoria de gestão e execução de obra, acompanhamento de gastos e relatórios gerenciais. É no acompanhamento mensal que entra o Elos OS.</p>
<p>Onde encontrar: placas de obra e stands de venda nas cidades da região, Instagram de lançamentos, sindicatos e associações da construção civil, lojas de material que atendem obras, arquitetos e escritórios de projeto que indicam fornecedores.</p>
<h3>Administradoras de condomínio: execução de obras</h3>
<p>Quem compra: a administradora indica e o síndico e o conselho aprovam. A administradora é o canal que multiplica, porque uma única parceria abre dezenas de prédios.</p>
<p>O que dói para eles: infiltração, garagem com vazamento, piso quebrado, fachada com problema, obra que ninguém fiscaliza e prestador que some. O síndico precisa de alguém que diagnostique, apresente orçamento claro para a assembleia e entregue com relatório.</p>
<p>O que oferecemos: vistoria técnica com diagnóstico, orçamento detalhado pronto para assembleia, execução com engenheira responsável e diário de obra com fotos enviado ao condomínio. Serviços de entrada: impermeabilização de terraços, lajes e reservatórios, recuperação de pisos, fechamento de fachada, rufos e calhas, recuperação de garagens.</p>
<p>Prova que já temos: a obra do Edifício Crystal, com diagnóstico da causa real das infiltrações, impermeabilização com teste de estanqueidade aprovado e diário de obra para o condomínio.</p>
<h2>Preço do orçamento analítico</h2>
<p>Base de cálculo: hora da Elos de R$ 315 (pró-labore de R$ 20 mil, custos de R$ 2 mil, 15% de imposto e 15% de margem, sobre 100 horas produtivas por mês).</p>
<p><b>Preço = R$ 15.750 + R$ 3,37 por m² de área construída.</b> São 50 horas fixas em qualquer orçamento (análise, composições, curva ABC e revisão) mais cerca de 10,7 horas por 1.000 m² de quantitativos.</p>
<div class="tablewrap"><table>
